# The suite on a runner, for every PR and each push to main.
#
# The commands are the ones a contributor runs locally, unchanged: `npm test`
# builds (vite + embed + tsc) and runs the vitest suite via pretest, so the
# typecheck and the tarball-relevant build are covered by the same command.
# `bun test tests/bun/` covers the bun-runtime paths (sqlite adapter, MCP
# translation) that vitest cannot run.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Tests (build + typecheck + vitest)
        run: npm test
      - name: Bun-runtime tests
        run: bun test tests/bun/

  required:
    name: required
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify mandatory CI jobs succeeded
        run: |
          set -euo pipefail
          results='${{ toJson(needs) }}'
          echo "CI results: $results"
          failed=$(echo "$results" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Required dependencies failed: $failed"
            exit 1
          fi
          echo "All required checks passed"
